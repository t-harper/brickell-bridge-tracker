name: Deploy to prod

on:
  push:
    branches: [main]
  workflow_dispatch:

# Serialize deploys against the DynamoDB lock: cancelling mid-flight would
# leave a stuck lock that the next run can't acquire without manual cleanup.
concurrency:
  group: deploy-prod
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  TF_VERSION: 1.9.0
  AWS_ROLE_ARN: arn:aws:iam::831473839640:role/bridge-tracker-gha-apply

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      # Block on high/critical CVEs in production deps. Dev deps (vitest,
      # esbuild, typescript) aren't shipped to Lambda, so excluding them
      # avoids noise from a pile of build-time-only transitives.
      - name: Audit production dependencies
        run: npm audit --audit-level=high --omit=dev

      # @bridge-tracker/shared exposes types via dist/, which is gitignored —
      # downstream packages can't resolve it until shared is built.
      - name: Build shared package
        run: npm run build --workspace=@bridge-tracker/shared

      - run: npm run typecheck

      - run: npm test

      - name: Test production deployment guards
        run: node --test scripts/production-apns-gate.test.mjs scripts/production-plan.test.mjs

      - name: Bundle Lambda artifacts
        run: npm run bundle

      - name: Build frontend
        run: npm run build --workspace=@bridge-tracker/frontend

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Test Lambda artifact key safety
        run: node --test scripts/lambda-artifact-keys.test.mjs

      - name: Verify production AWS account
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          if [[ "$ACCOUNT_ID" != "831473839640" ]]; then
            echo "::error::Unexpected AWS account; refusing production Terraform."
            exit 1
          fi
          echo "AWS_ACCOUNT_ID=$ACCOUNT_ID" >> "$GITHUB_ENV"

      - name: Terraform init
        working-directory: infra
        run: terraform init -no-color

      - name: Select prod workspace
        working-directory: infra
        run: terraform workspace select prod

      - name: Terraform plan
        working-directory: infra
        env:
          TF_VAR_apns_p8_pem: ${{ secrets.APNS_KEY_P8 }}
        run: |
          if [[ ! "${TF_VAR_apns_p8_pem:-}" =~ [^[:space:]] ]]; then
            echo "::error::APNS_KEY_P8 is missing; refusing to remove production APNs configuration."
            echo "exitcode=1" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          umask 077
          terraform plan -no-color -out=prod.tfplan -var-file=envs/prod.tfvars

      - name: Verify production plan
        working-directory: infra
        run: |
          umask 077
          terraform show -json prod.tfplan > prod-plan.json
          node ../scripts/verify-production-plan.mjs prod-plan.json

      - name: Terraform apply
        working-directory: infra
        env:
          # .p8 contents land in SSM (SecureString) and the Lambda only needs
          # the SSM path, so the key value never appears in build output.
          TF_VAR_apns_p8_pem: ${{ secrets.APNS_KEY_P8 }}
        run: |
          if [[ ! "${TF_VAR_apns_p8_pem:-}" =~ [^[:space:]] ]]; then
            echo "::error::APNS_KEY_P8 is missing; refusing to remove production APNs configuration."
            echo "exitcode=1" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          terraform apply -no-color prod.tfplan

      - name: Sync frontend to S3
        working-directory: infra
        run: |
          BUCKET=$(terraform output -raw frontend_bucket)
          aws s3 sync ../packages/frontend/dist/ "s3://${BUCKET}/" --delete

      - name: Invalidate CloudFront
        working-directory: infra
        run: |
          DIST_ID=$(terraform output -raw cloudfront_distribution_id)
          aws cloudfront create-invalidation --distribution-id "$DIST_ID" --paths '/*'

      - name: Remove private production plan files
        if: always()
        run: rm -f -- infra/prod.tfplan infra/prod-plan.json infra/plan.txt
