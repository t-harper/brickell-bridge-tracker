name: Plan on PR

on:
  pull_request:
    branches: [main]

permissions:
  id-token: write
  contents: read
  pull-requests: write

env:
  AWS_REGION: us-east-1
  TF_VERSION: 1.9.0
  AWS_ROLE_ARN: arn:aws:iam::831473839640:role/bridge-tracker-gha-plan

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      # Compare deps before/after this PR; block on new high/critical CVEs.
      # Runs first so dep regressions surface even if later steps fail.
      - name: Dependency review
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      # Same gate as deploy.yml — catch CVEs that have surfaced since
      # main was last audited, even on PRs that don't touch package.json.
      - name: Audit production dependencies
        run: npm audit --audit-level=high --omit=dev

      # @bridge-tracker/shared exposes types via dist/, which is gitignored —
      # downstream packages can't resolve it until shared is built.
      - name: Build shared package
        run: npm run build --workspace=@bridge-tracker/shared

      - run: npm run typecheck

      - run: npm test

      - name: Test production deployment guards
        run: node --test scripts/production-apns-gate.test.mjs scripts/production-plan.test.mjs

      # Plan needs the freshly-built zips so source_code_hash diffs are accurate.
      - name: Bundle Lambda artifacts
        run: npm run bundle

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Test Lambda artifact key safety
        run: node --test scripts/lambda-artifact-keys.test.mjs

      - name: Verify production AWS account
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          if [[ "$ACCOUNT_ID" != "831473839640" ]]; then
            echo "::error::Unexpected AWS account; refusing production Terraform."
            exit 1
          fi
          echo "AWS_ACCOUNT_ID=$ACCOUNT_ID" >> "$GITHUB_ENV"

      - name: Terraform init
        working-directory: infra
        run: terraform init -no-color

      - name: Select prod workspace
        working-directory: infra
        run: terraform workspace select prod

      - name: Terraform plan
        id: plan
        working-directory: infra
        continue-on-error: true
        env:
          TF_VAR_apns_p8_pem: ${{ secrets.APNS_KEY_P8 }}
        run: |
          if [[ ! "${TF_VAR_apns_p8_pem:-}" =~ [^[:space:]] ]]; then
            echo "::error::APNS_KEY_P8 is missing; refusing to remove production APNs configuration."
            echo "exitcode=1" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          umask 077
          set -o pipefail
          set +e
          terraform plan -no-color -lock=false -detailed-exitcode -out=prod.tfplan -var-file=envs/prod.tfvars 2>&1 | tee plan.txt
          STATUS=${PIPESTATUS[0]}
          set -e
          echo "exitcode=$STATUS" >> "$GITHUB_OUTPUT"
          if [[ "$STATUS" != 0 && "$STATUS" != 2 ]]; then exit 1; fi

      - name: Verify production plan
        id: verify_plan
        if: steps.plan.outcome == 'success'
        working-directory: infra
        run: |
          umask 077
          terraform show -json prod.tfplan > prod-plan.json
          node ../scripts/verify-production-plan.mjs prod-plan.json

      - name: Post plan as PR comment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          # GitHub comment max is 65536 chars; reserve some for the wrapper.
          PLAN=$(if [[ -f infra/plan.txt ]]; then head -c 60000 infra/plan.txt; else echo "No production plan was generated; a prerequisite failed."; fi)
          STATUS="${{ steps.plan.outputs.exitcode }}"
          {
            echo "## Terraform Plan (\`prod\` workspace)"
            echo
            echo "Exit code: \`${STATUS}\` (0 = no changes, 2 = changes planned, 1 = error)"
            echo
            echo '```'
            echo "$PLAN"
            echo '```'
          } > comment.md
          gh pr comment "$PR_NUMBER" --body-file comment.md

      - name: Fail job if plan errored
        if: steps.plan.outcome != 'success' || steps.plan.outputs.exitcode == '1' || steps.verify_plan.outcome != 'success'
        run: exit 1

      - name: Remove private production plan files
        if: always()
        run: rm -f -- infra/prod.tfplan infra/prod-plan.json infra/plan.txt
