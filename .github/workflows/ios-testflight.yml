name: iOS to TestFlight

# Builds the iOS app on the existing hosted Mac and uploads to App Store Connect →
# TestFlight when upload is enabled. Manual runs default to build-only.
# Uploads can notify existing automatically distributing internal groups;
# other groups require an explicit Add Builds step after processing.
#
# Required GitHub secrets:
#   APPLE_TEAM_ID       — 10-char Team ID from developer.apple.com → Membership
#   ASC_API_KEY_ID      — 10-char key ID from App Store Connect → Users and Access → Keys
#   ASC_API_ISSUER_ID   — UUID issuer ID from the same page
#   ASC_API_KEY_P8      — full contents of the AuthKey_<KEY_ID>.p8 file (including BEGIN/END lines)
#   APPLE_APP_ID        — numeric App Store Connect app ID (used to deep-link the build in the run summary)
#
# The App Store Connect API key must have App Manager role or higher to upload builds.

on:
  push:
    branches: [main]
    paths: ["ios/**", ".github/workflows/ios-testflight.yml", "scripts/testflight-preflight*.mjs"]
  workflow_dispatch:
    inputs:
      api_base_url:
        description: "API base URL baked into the build"
        required: true
        default: "https://bridge.travis-harper.net"
        type: string
      simulator_only:
        description: "Run simulator UI validation only; skips signing and TestFlight"
        required: true
        default: false
        type: boolean
      upload:
        description: "Upload to TestFlight (may notify existing testers); false builds an IPA only"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  build-and-upload:
    if: github.event_name != 'workflow_dispatch' || !inputs.simulator_only
    # This repository is public; retain its hosted runner rather than adding
    # it to the private repository runner pool.
    runs-on: macos-latest
    concurrency:
      group: brickell-ios-signing
      cancel-in-progress: false
    timeout-minutes: 30
    env:
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
      ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
      APPLE_APP_ID: ${{ secrets.APPLE_APP_ID }}
      API_BASE_URL: ${{ inputs.api_base_url || 'https://bridge.travis-harper.net' }}
      UPLOAD_TO_TESTFLIGHT: ${{ github.event_name == 'push' || inputs.upload }}
      # TestFlight requires a strictly-increasing build number within a given
      # marketing version. github.run_number is monotonic per workflow file,
      # so reuse across builds is impossible without a manual reset.
      BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Test release preflight
        run: node --test scripts/testflight-preflight.test.mjs

      # Check account agreements and exact app access before a costly archive.
      # Build-only verification uses the existing signing assets without ASC.
      - name: Check App Store Connect access
        if: env.UPLOAD_TO_TESTFLIGHT == 'true'
        env:
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
        run: node scripts/testflight-preflight.mjs

      # Apple requires apps to be built with the iOS 26 SDK or later for
      # App Store Connect uploads. Select an installed SDK for this job only;
      # never change the runner's global xcode-select setting.
      - name: Select supported Xcode
        run: |
          DEVELOPER_DIR=$(python3 <<'PY'
          import glob
          import os
          import subprocess
          import sys

          candidates = glob.glob('/Applications/Xcode*.app/Contents/Developer')
          try:
              current = subprocess.check_output(
                  ['xcode-select', '-p'], text=True, stderr=subprocess.DEVNULL,
              ).strip()
              candidates.append(current)
          except subprocess.CalledProcessError:
              pass
          supported = []
          for candidate in set(candidates):
              try:
                  sdk = subprocess.check_output(
                      ['xcrun', '--sdk', 'iphoneos', '--show-sdk-version'],
                      env={**os.environ, 'DEVELOPER_DIR': candidate},
                      text=True, stderr=subprocess.DEVNULL,
                  ).strip()
                  version = tuple(int(part) for part in sdk.split('.'))
                  if version >= (26,):
                      supported.append((version, candidate))
              except (ValueError, subprocess.CalledProcessError):
                  pass
          if not supported:
              sys.exit('No installed Xcode provides the required iOS 26 SDK or later.')
          print(max(supported)[1])
          PY
          )
          export DEVELOPER_DIR
          printf 'DEVELOPER_DIR=%s\n' "$DEVELOPER_DIR" >> "$GITHUB_ENV"
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Test mobile API requests
        working-directory: ios
        run: |
          xcrun swiftc -swift-version 5 -parse-as-library \
            Shared/APIClient.swift Shared/Models.swift Shared/BuildConfig.swift \
            Tests/APIClientTests.swift -o "$RUNNER_TEMP/bridge-api-tests"
          "$RUNNER_TEMP/bridge-api-tests"

      - name: Install XcodeGen if needed
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            HOMEBREW_NO_AUTO_UPDATE=1 brew install xcodegen
          fi
          xcodegen --version

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Prepare isolated signing workspace
        run: |
          umask 077
          SIGNING_DIR=$(mktemp -d "$RUNNER_TEMP/bridge-signing-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.XXXXXX")
          printf 'SIGNING_DIR=%s\nAPI_PRIVATE_KEYS_DIR=%s/private_keys\n' \
            "$SIGNING_DIR" "$SIGNING_DIR" >> "$GITHUB_ENV"

      # Secret comes through env so it never appears in the script text
      # (GitHub also masks it in logs, but env-passing is the safer pattern).
      - name: Write App Store Connect API key
        if: env.UPLOAD_TO_TESTFLIGHT == 'true'
        env:
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
        run: |
          umask 077
          mkdir "$API_PRIVATE_KEYS_DIR"
          KEY_PATH="$API_PRIVATE_KEYS_DIR/AuthKey_${ASC_API_KEY_ID}.p8"
          printf '%s' "$ASC_API_KEY_P8" > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          echo "KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"

      # Bake the API URL into a Swift constant. Tried piping via
      # INFOPLIST_KEY_API_BASE_URL → Bundle.main.object(forInfoDictionaryKey:)
      # but Xcode's auto-Info.plist generator only translates that prefix for
      # Apple-recognized keys, so custom keys silently disappear and the app
      # fell through to its localhost fallback on real devices.
      - name: Bake API URL into BuildConfig.swift
        working-directory: ios
        run: |
          cat > Shared/BuildConfig.swift <<EOF
          import Foundation

          enum BuildConfig {
              static let apiBaseURL = "${API_BASE_URL}"
          }
          EOF
          grep apiBaseURL Shared/BuildConfig.swift

      # Durable signing: import the stored Apple Distribution cert + both App
      # Store profiles (app + widget) into a temp keychain. Manual signing reuses
      # this one certificate every run instead of minting a new dev cert.
      - name: Install signing certificate & provisioning profiles
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
          BUILD_PROVISION_PROFILE_WIDGET_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_WIDGET_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          umask 077
          # Capture original settings and planned, unique paths before any
          # keychain mutation or secret write, including for failure cleanup.
          python3 <<'PY'
          import json
          import os
          from pathlib import Path
          import shlex
          import subprocess

          directory = Path(os.environ['SIGNING_DIR'])
          profiles = Path.home() / 'Library/MobileDevice/Provisioning Profiles'
          destinations = [profiles / (directory.name + '-' + target + '.mobileprovision')
                          for target in ('app', 'widget')]
          if any(os.path.lexists(path) for path in destinations):
              raise SystemExit('Refusing to overwrite existing provisioning profiles.')
          state = {
              'search': shlex.split(subprocess.check_output(
                  ['security', 'list-keychains', '-d', 'user'], text=True)),
              'default': shlex.split(subprocess.check_output(
                  ['security', 'default-keychain', '-d', 'user'], text=True)),
              'keychain': str(directory / 'app-signing.keychain-db'),
              'profiles': [str(path) for path in destinations],
          }
          if len(state['default']) != 1:
              raise SystemExit('Unable to capture the original default keychain.')
          with (directory / 'state.json.tmp').open('x') as file:
              json.dump(state, file)
          (directory / 'state.json.tmp').replace(directory / 'state.json')
          PY
          CERT_PATH="$SIGNING_DIR/dist_cert.p12"
          KC_PATH="$SIGNING_DIR/app-signing.keychain-db"
          printf '%s' "$BUILD_CERTIFICATE_BASE64" | base64 --decode > "$CERT_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KC_PATH"
          security set-keychain-settings -lut 21600 "$KC_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KC_PATH"
          security import "$CERT_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KC_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KC_PATH" >/dev/null
          python3 <<'PY'
          import base64
          import json
          import os
          from pathlib import Path
          import subprocess

          state = json.loads((Path(os.environ['SIGNING_DIR']) / 'state.json').read_text())
          subprocess.run(['security', 'list-keychains', '-d', 'user', '-s',
                          state['keychain'], *state['search']], check=True)
          subprocess.run(['security', 'default-keychain', '-d', 'user', '-s',
                          state['keychain']], check=True)
          for destination, variable in zip(state['profiles'], (
              'BUILD_PROVISION_PROFILE_BASE64', 'BUILD_PROVISION_PROFILE_WIDGET_BASE64',
          )):
              path = Path(destination)
              path.parent.mkdir(parents=True, exist_ok=True)
              with path.open('xb') as file:
                  file.write(base64.b64decode(''.join(os.environ[variable].split()), validate=True))
          PY
          echo "Signing identities available:"
          security find-identity -v -p codesigning "$KC_PATH"

      - name: Build archive
        working-directory: ios
        run: |
          xcodebuild \
            -project BridgeTracker.xcodeproj \
            -scheme BridgeTracker \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath build/BridgeTracker.xcarchive \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            archive

      - name: Export IPA
        working-directory: ios
        run: |
          cat > build/ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>teamID</key>
            <string>${APPLE_TEAM_ID}</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>signingCertificate</key>
            <string>Apple Distribution</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>net.travis-harper.bridgetracker</key>
              <string>Bridge Tracker App Store</string>
              <key>net.travis-harper.bridgetracker.widget</key>
              <string>Bridge Tracker Widget AppStore</string>
            </dict>
            <key>destination</key>
            <string>export</string>
            <key>stripSwiftSymbols</key>
            <true/>
            <key>uploadSymbols</key>
            <true/>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath build/BridgeTracker.xcarchive \
            -exportPath build/ipa \
            -exportOptionsPlist build/ExportOptions.plist

      - name: Preserve signed IPA
        uses: actions/upload-artifact@v7
        with:
          name: Brickell-Bridge-${{ github.run_number }}
          path: ios/build/ipa/*.ipa
          if-no-files-found: error
          retention-days: 7

      - name: Build-only summary
        if: env.UPLOAD_TO_TESTFLIGHT != 'true'
        run: |
          {
            echo "## Signed build only"
            echo "Build $BUILD_NUMBER archived and exported with the existing signing assets."
            echo "Download the signed IPA from this run's artifact (retained for seven days)."
            echo "No App Store Connect upload or tester distribution was requested."
            echo "An App Store IPA cannot be installed directly; a TestFlight upload is still required."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload to TestFlight
        if: env.UPLOAD_TO_TESTFLIGHT == 'true'
        working-directory: ios
        run: |
          IPA=$(find build/ipa -name '*.ipa' | head -1)
          if [ -z "$IPA" ]; then
            echo "::error::No IPA found in build/ipa"
            exit 1
          fi
          SIZE=$(du -h "$IPA" | cut -f1)
          echo "Uploading $IPA ($SIZE) build=$BUILD_NUMBER"

          # Explicit key selection avoids altool's earlier home-directory
          # search locations; the Mac's existing keys are never replaced.
          xcrun altool --upload-app \
            -f "$IPA" \
            -t ios \
            --api-key "$ASC_API_KEY_ID" \
            --api-issuer "$ASC_API_ISSUER_ID" \
            --p8-file-path "$KEY_PATH"

          ASC_LINK="https://appstoreconnect.apple.com/apps/${APPLE_APP_ID}/testflight/ios"
          {
            echo "## TestFlight upload"
            echo ""
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Build number | \`$BUILD_NUMBER\` |"
            echo "| IPA size | $SIZE |"
            echo "| API URL | \`$API_BASE_URL\` |"
            echo "| App Store Connect | [TestFlight builds]($ASC_LINK) |"
            echo ""
            echo "Apple processes the build (~5-15 min for first ingest, faster on subsequent)."
            echo "After processing, verify the build's status and expiration in App Store Connect."
            echo "Existing internal groups need automatic distribution enabled or Add Builds."
            echo "External groups need Add Builds and any required beta review before testing."
            echo "Upload success does not verify tester access or installation."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Restore keychain settings and remove job signing files
        if: always() && env.SIGNING_DIR != ''
        run: |
          python3 <<'PY'
          import json
          import os
          from pathlib import Path
          import shutil
          import subprocess
          import sys

          directory = Path(os.environ['SIGNING_DIR'])
          if (directory.parent.resolve() != Path(os.environ['RUNNER_TEMP']).resolve()
                  or not directory.name.startswith('bridge-signing-')):
              sys.exit('Refusing cleanup outside the job signing workspace.')
          failures = []
          state_path = directory / 'state.json'
          if state_path.exists():
              state = json.loads(state_path.read_text())
              commands = [
                  ['security', 'list-keychains', '-d', 'user', '-s', *state['search']],
                  ['security', 'default-keychain', '-d', 'user', '-s', *state['default']],
              ]
              if Path(state['keychain']).exists():
                  commands.append(['security', 'delete-keychain', state['keychain']])
              for command in commands:
                  if subprocess.run(command).returncode:
                      failures.append('Could not restore or remove the job keychain.')
              for profile in state['profiles']:
                  try:
                      Path(profile).unlink(missing_ok=True)
                  except OSError:
                      failures.append('Could not remove a job provisioning profile.')
          try:
              shutil.rmtree(directory)
          except FileNotFoundError:
              pass
          except OSError:
              failures.append('Could not remove the job signing workspace.')
          if failures:
              sys.exit('\n'.join(failures))
          PY

  simulator-validation:
    name: Simulator UI validation
    if: github.event_name == 'workflow_dispatch' && inputs.simulator_only
    runs-on: macos-latest
    timeout-minutes: 20
    concurrency:
      group: brickell-ios-simulator-${{ github.ref }}
      cancel-in-progress: false
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - name: Prepare isolated validation workspace
        run: |
          set -euo pipefail
          SIM_WORK_DIR=$(mktemp -d "$RUNNER_TEMP/bridge-simulator-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.XXXXXX")
          mkdir "$SIM_WORK_DIR/evidence"
          printf 'SIM_WORK_DIR=%s\n' "$SIM_WORK_DIR" >> "$GITHUB_ENV"

      - name: Select supported Xcode
        run: |
          DEVELOPER_DIR=$(python3 <<'PY'
          import glob
          import os
          import subprocess
          import sys

          candidates = glob.glob('/Applications/Xcode*.app/Contents/Developer')
          try:
              current = subprocess.check_output(
                  ['xcode-select', '-p'], text=True, stderr=subprocess.DEVNULL,
              ).strip()
              candidates.append(current)
          except subprocess.CalledProcessError:
              pass
          supported = []
          for candidate in set(candidates):
              try:
                  sdk = subprocess.check_output(
                      ['xcrun', '--sdk', 'iphoneos', '--show-sdk-version'],
                      env={**os.environ, 'DEVELOPER_DIR': candidate},
                      text=True, stderr=subprocess.DEVNULL,
                  ).strip()
                  version = tuple(int(part) for part in sdk.split('.'))
                  if version >= (26,):
                      supported.append((version, candidate))
              except (ValueError, subprocess.CalledProcessError):
                  pass
          if not supported:
              sys.exit('No installed Xcode provides the required iOS 26 SDK or later.')
          print(max(supported)[1])
          PY
          )
          export DEVELOPER_DIR
          printf 'DEVELOPER_DIR=%s\n' "$DEVELOPER_DIR" >> "$GITHUB_ENV"
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Install XcodeGen if needed
        timeout-minutes: 3
        run: |
          set -euo pipefail
          if ! command -v xcodegen >/dev/null 2>&1; then
            HOMEBREW_NO_AUTO_UPDATE=1 brew install xcodegen
          fi
          xcodegen --version

      - name: Run Foundation client and model regression tests
        working-directory: ios
        run: |
          set -euo pipefail
          xcrun swiftc -swift-version 5 -parse-as-library \
            Shared/APIClient.swift Shared/Models.swift Shared/BuildConfig.swift \
            Tests/APIClientTests.swift -o "$SIM_WORK_DIR/bridge-api-tests" \
            2>&1 | tee "$SIM_WORK_DIR/evidence/foundation-build.log"
          "$SIM_WORK_DIR/bridge-api-tests" 2>&1 | tee "$SIM_WORK_DIR/evidence/foundation-tests.log"

      - name: Configure loopback API and simulator-only local networking
        working-directory: ios
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json
          import os
          from pathlib import Path

          Path('Shared/BuildConfig.swift').write_text(
              'import Foundation\n\nenum BuildConfig {\n'
              '    static let apiBaseURL = "http://localhost:8001"\n}\n'
          )
          # Merge a job-only overlay over the real spec, retaining the target's
          # INFOPLIST_KEY display/launch/Live Activity settings. Use a nested
          # plist instead of an unsupported nested build-setting key.
          overlay = {
              'include': 'project.yml',
              'targets': {'BridgeTracker': {'info': {
                  'path': str(Path(os.environ['SIM_WORK_DIR']) / 'Simulator-Info.plist'),
                  'properties': {'NSAppTransportSecurity': {'NSAllowsLocalNetworking': True}},
              }}},
          }
          Path('simulator-ci.json').write_text(json.dumps(overlay))
          PY
          xcodegen generate --spec simulator-ci.json
          python3 <<'PYSCHEME'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          scheme = Path('BridgeTracker.xcodeproj/xcshareddata/xcschemes/BridgeTracker.xcscheme')
          targets = ET.parse(scheme).findall('./TestAction/Testables/TestableReference/BuildableReference')
          assert any(target.get('BlueprintName') == 'BridgeTrackerUITests' for target in targets), (
              'The shared BridgeTracker scheme does not include BridgeTrackerUITests.'
          )
          PYSCHEME

      - name: Select and boot an owned simulator
        timeout-minutes: 3
        run: |
          set -euo pipefail
          xcrun simctl list runtimes --json > "$SIM_WORK_DIR/evidence/runtimes.json"
          xcrun simctl list devicetypes --json > "$SIM_WORK_DIR/evidence/device-types.json"
          python3 <<'PY'
          import json
          import os
          from pathlib import Path

          directory = Path(os.environ['SIM_WORK_DIR'])
          runtimes = json.loads((directory / 'evidence/runtimes.json').read_text())['runtimes']
          devices = json.loads((directory / 'evidence/device-types.json').read_text())['devicetypes']
          def version(runtime):
              return tuple(int(part) for part in runtime['version'].split('.'))
          runtimes = sorted(
              (runtime for runtime in runtimes
               if runtime.get('isAvailable') and '.iOS-' in runtime['identifier']
               and version(runtime) >= (26,)),
              key=version, reverse=True,
          )
          selection = None
          for runtime in runtimes:
              parts = (*version(runtime), 0, 0)
              encoded = (parts[0] << 16) | (parts[1] << 8) | parts[2]
              compatible = [
                  device for device in devices
                  if device.get('productFamily') == 'iPhone'
                  and device.get('minRuntimeVersion', 0) <= encoded
                  <= device.get('maxRuntimeVersion', 0xFFFFFFFF)
              ]
              if compatible:
                  device = sorted(
                      compatible, key=lambda item: (item.get('minRuntimeVersion', 0), item['identifier']),
                  )[-1]
                  selection = {'runtime': runtime['identifier'], 'deviceType': device['identifier'],
                               'runtimeVersion': runtime['version'], 'deviceName': device['name']}
                  break
          if not selection:
              raise SystemExit('No available iOS 26+ runtime with a compatible iPhone device type.')
          (directory / 'evidence/simulator-selection.json').write_text(json.dumps(selection, indent=2))
          (directory / 'simulator-selection.env').write_text(
              selection['runtime'] + '\n' + selection['deviceType'] + '\n')
          PY
          RUNTIME=$(sed -n '1p' "$SIM_WORK_DIR/simulator-selection.env")
          DEVICE_TYPE=$(sed -n '2p' "$SIM_WORK_DIR/simulator-selection.env")
          SIMULATOR_ID=$(xcrun simctl create \
            "Brickell-CI-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" "$DEVICE_TYPE" "$RUNTIME")
          [[ "$SIMULATOR_ID" =~ ^[A-Fa-f0-9-]{36}$ ]]
          printf '%s\n' "$SIMULATOR_ID" > "$SIM_WORK_DIR/simulator-id"
          printf 'SIMULATOR_ID=%s\n' "$SIMULATOR_ID" >> "$GITHUB_ENV"
          xcrun simctl boot "$SIMULATOR_ID"
          xcrun simctl bootstatus "$SIMULATOR_ID" -b

      - name: Start the owned loopback fixture
        run: |
          set -euo pipefail
          python3 -u "$GITHUB_WORKSPACE/scripts/ios-ui-fixture.py" --port 8001 \
            </dev/null > "$SIM_WORK_DIR/evidence/fixture.log" 2>&1 &
          FIXTURE_PID=$!
          printf '%s\n' "$FIXTURE_PID" > "$SIM_WORK_DIR/fixture-pid"
          printf 'FIXTURE_PID=%s\n' "$FIXTURE_PID" >> "$GITHUB_ENV"
          export FIXTURE_PID
          python3 <<'PY'
          import json
          import os
          import time
          import urllib.request

          for _ in range(40):
              try:
                  os.kill(int(os.environ['FIXTURE_PID']), 0)
                  with urllib.request.urlopen('http://127.0.0.1:8001/__control/health', timeout=1) as response:
                      if response.status == 200 and json.load(response).get('ok') is True:
                          print('Loopback fixture ready.')
                          break
              except (OSError, ValueError):
                  pass
              time.sleep(0.25)
          else:
              raise SystemExit('The owned loopback fixture did not become ready.')
          PY
          kill -0 "$FIXTURE_PID"

      - name: Run app UI tests on the owned simulator
        timeout-minutes: 12
        working-directory: ios
        run: |
          set -euo pipefail
          xcodebuild test \
            -project BridgeTracker.xcodeproj \
            -scheme BridgeTracker \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            -destination-timeout 60 \
            -derivedDataPath "$SIM_WORK_DIR/DerivedData" \
            -resultBundlePath "$SIM_WORK_DIR/evidence/TestResults.xcresult" \
            -parallel-testing-enabled NO \
            -maximum-concurrent-test-simulator-destinations 1 \
            -only-testing:BridgeTrackerUITests \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee "$SIM_WORK_DIR/evidence/xcodebuild.log"

      - name: Require a nonempty successful UI test result
        run: |
          set -euo pipefail
          xcrun xcresulttool get test-results summary \
            --path "$SIM_WORK_DIR/evidence/TestResults.xcresult" \
            > "$SIM_WORK_DIR/evidence/test-summary.json"
          python3 <<'PYRESULT'
          import json
          import os
          from pathlib import Path

          path = Path(os.environ['SIM_WORK_DIR']) / 'evidence/test-summary.json'
          result = json.loads(path.read_text())
          assert result.get('passedTests', 0) > 0, 'No UI test passed in the result bundle.'
          assert result.get('failedTests', 0) == 0, 'The result bundle contains failed UI tests.'
          print(f"Passed UI tests: {result['passedTests']}")
          PYRESULT

      - name: Collect final fixture and built-app evidence
        if: always() && env.SIM_WORK_DIR != ''
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json
          import os
          from pathlib import Path
          import plistlib
          import urllib.request

          directory = Path(os.environ['SIM_WORK_DIR'])
          evidence = directory / 'evidence'
          try:
              with urllib.request.urlopen('http://127.0.0.1:8001/__control/requests', timeout=2) as response:
                  audit = json.load(response)
          except (OSError, ValueError) as error:
              audit = {'unavailable': str(error)}
          (evidence / 'fixture-requests.json').write_text(json.dumps(audit, indent=2))
          info = directory / 'DerivedData/Build/Products/Debug-iphonesimulator/BridgeTracker.app/Info.plist'
          if info.exists():
              data = plistlib.loads(info.read_bytes())
              summary = {key: data.get(key) for key in (
                  'CFBundleIdentifier', 'CFBundleDisplayName', 'UILaunchScreen',
                  'NSSupportsLiveActivities', 'NSSupportsLiveActivitiesFrequentUpdates',
                  'UIApplicationSceneManifest', 'ITSAppUsesNonExemptEncryption', 'NSAppTransportSecurity',
              )}
              (evidence / 'app-info.json').write_text(json.dumps(summary, indent=2))
              assert data.get('NSAppTransportSecurity', {}).get('NSAllowsLocalNetworking') is True
              assert data.get('CFBundleDisplayName') == 'Brickell Bridge'
              assert data.get('NSSupportsLiveActivities') is True
              assert data.get('ITSAppUsesNonExemptEncryption') is False
              assert 'UILaunchScreen' in data and 'UIApplicationSceneManifest' in data
          PY

      - name: Remove only the job's simulator and fixture process
        if: always() && env.SIM_WORK_DIR != ''
        run: |
          set -euo pipefail
          python3 <<'PY'
          import os
          from pathlib import Path
          import re
          import signal
          import subprocess

          directory = Path(os.environ['SIM_WORK_DIR'])
          if (directory.parent.resolve() != Path(os.environ['RUNNER_TEMP']).resolve()
                  or not directory.name.startswith('bridge-simulator-')):
              raise SystemExit('Refusing cleanup outside the owned simulator workspace.')
          failures = []
          pid_file = directory / 'fixture-pid'
          if pid_file.exists():
              pid = int(pid_file.read_text())
              command = subprocess.run(
                  ['ps', '-p', str(pid), '-o', 'command='], text=True, capture_output=True,
              ).stdout
              expected = str(Path(os.environ['GITHUB_WORKSPACE']) / 'scripts/ios-ui-fixture.py')
              if expected in command and '--port 8001' in command:
                  try:
                      os.kill(pid, signal.SIGTERM)
                  except ProcessLookupError:
                      pass
          simulator_file = directory / 'simulator-id'
          if simulator_file.exists():
              simulator = simulator_file.read_text().strip()
              if not re.fullmatch(r'[A-Fa-f0-9-]{36}', simulator):
                  raise SystemExit('Invalid owned simulator ID.')
              subprocess.run(['xcrun', 'simctl', 'shutdown', simulator], check=False)
              if subprocess.run(['xcrun', 'simctl', 'delete', simulator]).returncode:
                  failures.append('Could not delete the owned simulator.')
          if failures:
              raise SystemExit('\n'.join(failures))
          PY

      - name: Preserve simulator validation evidence
        if: always() && env.SIM_WORK_DIR != ''
        uses: actions/upload-artifact@v7
        with:
          name: Brickell-Simulator-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.SIM_WORK_DIR }}/evidence/
          if-no-files-found: warn
          retention-days: 7
